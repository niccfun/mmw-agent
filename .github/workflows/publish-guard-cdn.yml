name: Publish Guard to R2 CDN

on:
  workflow_dispatch:
    inputs:
      guard_release:
        description: 'Immutable private Guard release (for example v0.1.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: publish-mmwx-guard-cdn
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and republish protected Guard
    runs-on: ubuntu-latest
    environment: release-signing
    env:
      EXPECTED_UPDATE_PUBLIC_KEY: 3aGta5gVWH1jVUInTJopAT7xB8soc4A8FgGEgHrVq6k=
    steps:
      - name: Validate immutable Guard release
        env:
          GUARD_RELEASE: ${{ inputs.guard_release }}
        run: |
          case "$GUARD_RELEASE" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::guard_release must use a version such as v0.1.0"; exit 1 ;;
          esac

      - name: Checkout the exact private Guard release
        env:
          GUARDD_PAT: ${{ secrets.GUARDD_PAT }}
          GUARD_RELEASE: ${{ inputs.guard_release }}
        run: |
          test -n "$GUARDD_PAT" || { echo "::error::GUARDD_PAT is required"; exit 1; }
          git clone --branch "$GUARD_RELEASE" --depth 1 \
            "https://x-access-token:${GUARDD_PAT}@github.com/iluobei/mmwx-guardd.git" guard-src
          test "$(git -C guard-src describe --tags --exact-match)" = "$GUARD_RELEASE"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - name: Download, checksum, and verify protected release artifacts
        env:
          GH_TOKEN: ${{ secrets.GUARDD_PAT }}
        run: |
          mkdir -p dist
          gh release download "${{ inputs.guard_release }}" --repo iluobei/mmwx-guardd \
            --dir dist --pattern 'mmwx-guardd*linux-*' --pattern checksums.txt --pattern 'version.json*'
          (cd dist && sha256sum -c checksums.txt)
          (cd guard-src && go run ./cmd/mmwx-verify \
            -public-key "$EXPECTED_UPDATE_PUBLIC_KEY" ../dist/version.json ../dist/version.json.sig)
          jq -e --arg release "${{ inputs.guard_release }}" \
            '.protected == true and .protector == "garble" and .secret_injection == "xor-shares-v1" and .release == $release' dist/version.json >/dev/null \
            || { echo "::error::Guard release is not an approved Garble/XOR-shares build"; exit 1; }
          for arch in amd64 arm64; do
            (cd guard-src && go run ./cmd/mmwx-verify \
              -public-key "$EXPECTED_UPDATE_PUBLIC_KEY" \
              "../dist/mmwx-guardd-agent-linux-${arch}" "../dist/mmwx-guardd-agent-linux-${arch}.sig")
          done

      - name: Upload immutable and current assets to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          BUCKET: ${{ secrets.R2_BUCKET }}
          GUARD_RELEASE: ${{ inputs.guard_release }}
        run: |
          test -n "$AWS_ACCESS_KEY_ID" && test -n "$AWS_SECRET_ACCESS_KEY" \
            && test -n "$BUCKET" || { echo "::error::R2 credentials are incomplete"; exit 1; }
          immutable_prefix="mmwx-guard/releases/${GUARD_RELEASE}"
          for file in dist/mmwx-guardd-agent-linux-* dist/checksums.txt dist/version.json*; do
            name=$(basename "$file")
            content_type=application/octet-stream
            [ "$name" = version.json ] && content_type=application/json
            [ "$name" = checksums.txt ] && content_type=text/plain
            aws s3 cp "$file" "s3://$BUCKET/$immutable_prefix/$name" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "$content_type" \
              --cache-control "public, max-age=31536000, immutable"
          done
          for file in dist/mmwx-guardd-agent-linux-* dist/checksums.txt dist/version.json*; do
            name=$(basename "$file")
            content_type=application/octet-stream
            [ "$name" = version.json ] && content_type=application/json
            [ "$name" = checksums.txt ] && content_type=text/plain
            aws s3 cp "$file" "s3://$BUCKET/mmwx-guard/$name" \
              --endpoint-url "$R2_ENDPOINT" \
              --content-type "$content_type" \
              --cache-control "no-store"
          done
          echo "Protected Guard published: https://dl.miaomiaowux.com/mmwx-guard/ (release=$GUARD_RELEASE)"

      - uses: actions/upload-artifact@v4
        with:
          name: mmwx-guard-${{ inputs.guard_release }}
          path: dist/
          retention-days: 7
