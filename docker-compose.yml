version: '3.8'

services:
  mmw-agent:
    image: ghcr.io/nuxproio/mmw-agent:latest
    container_name: mmw-agent
    restart: unless-stopped

    # host 模式强制:xray 入站端口动态创�?用户在主控加一个就开一�?,bridge 模式得跟着�?-p 映射;
    # agent 监听端口给主控反向连�?bridge 又得多映射一个。entrypoint 启动时检�?bridge 直接退出�?
    network_mode: host

    environment:
      # 主控连过来的端口(默认 12888)
      - MMWX_LISTEN_PORT=12888
      # 主控地址(必填)
      - MMWX_MASTER_URL=https://master.example.com
      # 主控添加 server 时给�?token(必填)
      - MMWX_MASTER_TOKEN=<填写主控端生成的 agent token>
      # 强制 embedded �?Docker 镜像不含外部 xray binary,只能 embedded
      - MMWX_XRAY_MODE=embedded
      # 容器探测(Dockerfile 已经设了,这里写一遍兜�?
      - DOCKER=1

    volumes:
      # agent config.yaml(可�?�?env 也能覆盖大部分配�?
      - ./config:/etc/mmw-agent
      # xray config(embedded 模式 agent 自己维护;映射出来方便排查)
      - ./xray-config:/usr/local/etc/xray
      # nginx 证书(主控下发�?agent 写在�?
      - ./nginx-cert:/etc/nginx/cert
      # nginx servers 配置(WSS 入站�?agent 写在�?
      - ./nginx-servers:/etc/nginx/servers
